<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Bible App</title>

    <meta
        name="description"
        content="A Bible reading app with multiple Bible versions."
    >

    <meta
        name="theme-color"
        content="#172554"
    >

    <link
        rel="manifest"
        href="./manifest.json"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

</head>


<body>


    <!-- =========================
         HEADER
    ========================== -->

    <header class="app-header">

        <div class="header-inner">

            <div class="logo">

                <div class="logo-icon">
                    📖
                </div>

                <div>

                    <h1>Bible App</h1>

                    <p>
                        Grow in Grace & Truth
                    </p>

                </div>

            </div>

        </div>

    </header>



    <!-- =========================
         MAIN CONTENT
    ========================== -->

    <main class="container">


        <!-- =========================
             BIBLE CONTROLS
        ========================== -->

        <section class="controls">

            <div class="control-grid">


                <!-- VERSION -->

                <div class="control-group">

                    <label for="versionSelect">
                        Bible Version
                    </label>

                    <select
                        id="versionSelect"
                    ></select>

                </div>



                <!-- BOOK -->

                <div class="control-group">

                    <label for="bookSelect">
                        Book
                    </label>

                    <select
                        id="bookSelect"
                    ></select>

                </div>



                <!-- CHAPTER -->

                <div class="control-group">

                    <label for="chapterSelect">
                        Chapter
                    </label>

                    <select
                        id="chapterSelect"
                    ></select>

                </div>


            </div>

        </section>



        <!-- =========================
             BIBLE READER
        ========================== -->

        <section
            id="reader"
            class="reader"
        >

            <div class="loading">

                <div class="loading-spinner"></div>

                <p>
                    Loading Scripture...
                </p>

            </div>

        </section>



        <!-- =========================
             CHAPTER NAVIGATION
        ========================== -->

        <div class="navigation">

            <button
                id="previousChapter"
            >
                ← Previous
            </button>


            <button
                id="nextChapter"
            >
                Next →
            </button>

        </div>


    </main>



    <!-- =========================
         FOOTER
    ========================== -->

    <footer>

        <p>
            Bible App • Grow in Grace & Truth
        </p>

        <p style="margin-top: 6px;">
            Scripture reader
        </p>

    </footer>



    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="./app.js"></script>


    <!-- =========================
         SERVICE WORKER
    ========================== -->

    <script>

        if ("serviceWorker" in navigator) {

            window.addEventListener(
                "load",
                () => {

                    navigator.serviceWorker
                        .register(
                            "./service-worker.js"
                        )
                        .then(() => {

                            console.log(
                                "Service Worker registered."
                            );

                        })
                        .catch(error => {

                            console.error(
                                "Service Worker registration failed:",
                                error
                            );

                        });

                }
            );

        }

    </script>


</body>

</html>
